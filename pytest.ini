[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
addopts = -m "not postgres_integration"
markers =
    postgres_integration: smoke/integration tests that run against a real Postgres instance
filterwarnings =
    ignore:Accessing argon2.__version__:DeprecationWarning
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning
