server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vtorchik.ru www.vtorchik.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/history-acme;
    }
    location / { return 301 https://vtorchik.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vtorchik.ru;
    ssl_certificate /etc/letsencrypt/live/vtorchik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtorchik.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://vtorchik.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vtorchik.ru;
    ssl_certificate /etc/letsencrypt/live/vtorchik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtorchik.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
